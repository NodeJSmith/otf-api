name: AI Auto-Sync TypeScript

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ai-generate-typescript:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 2
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: typescript/package-lock.json
        
    - name: Download change detection results
      if: github.event_name != 'workflow_dispatch'
      uses: actions/download-artifact@v4
      with:
        name: change-detection-results
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        
    - name: Load change detection results
      id: load_results
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "python_changed=true" >> $GITHUB_OUTPUT
          echo "changes_significant=true" >> $GITHUB_OUTPUT
          echo "files_changed=manual" >> $GITHUB_OUTPUT  
          echo "lines_changed=manual" >> $GITHUB_OUTPUT
        elif [[ -f results.txt ]]; then
          while IFS='=' read -r key value; do
            echo "$key=$value" >> $GITHUB_OUTPUT
          done < results.txt
        else
          echo "❌ Change detection results not found"
          exit 1
        fi
        
    - name: Check if should run
      id: should_run
      env:
        AI_SYNC_ENABLED: ${{ secrets.AI_SYNC_ENABLED || 'true' }}
      run: |
        if [[ "$AI_SYNC_ENABLED" != "true" ]]; then
          echo "should_run=false" >> $GITHUB_OUTPUT
          echo "🚫 AI sync disabled"
          exit 0
        fi
        
        if [[ "${{ steps.load_results.outputs.python_changed }}" == "true" ]] && [[ "${{ steps.load_results.outputs.changes_significant }}" == "true" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "🤖 AI sync needed"
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
          echo "⚠️ Changes not significant"
        fi
        
    - name: Install dependencies
      if: steps.should_run.outputs.should_run == 'true'
      run: |
        cd typescript && npm ci
        pip install httpx
        
    - name: Run sync pipeline
      if: steps.should_run.outputs.should_run == 'true'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        source ~/.cargo/env
        uv python install 3.11
        cd python && uv sync
        cd .. && npm run sync
        
    - name: AI Generate Updates
      if: steps.should_run.outputs.should_run == 'true'
      env:
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_AUTO_SYNC_KEY }}
      run: |
        python scripts/ai_generate_typescript.py
        
    - name: Test updates
      if: steps.should_run.outputs.should_run == 'true'
      run: |
        cd typescript
        npm run lint:fix || true
        npm run type-check || echo "⚠️ Type check issues"
        npm test || echo "⚠️ Test issues"
        
    - name: Create PR
      if: steps.should_run.outputs.should_run == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "🤖 AI Auto-sync TypeScript updates"
        title: "🤖 AI Auto-Sync: TypeScript Updates"
        body: |
          ## 🤖 AI-Powered TypeScript Auto-Sync
          
          Updates TypeScript implementation based on Python changes.
          
          **Files changed:** ${{ steps.load_results.outputs.files_changed }}
          **Lines changed:** ${{ steps.load_results.outputs.lines_changed }}
          
          ### Review Required
          - [ ] Verify implementation logic  
          - [ ] Run full test suite
          - [ ] Check for breaking changes
          
          🤖 *Generated by GitHub Actions with Claude AI*
        branch: ai-auto-sync-${{ github.run_number }}
        delete-branch: true
        labels: ai-generated