# release-please legitimately needs workflow-level write permissions to create releases and
# PRs, and uses a GitHub App token by design (not GITHUB_TOKEN). Its sync-lockfile job pushes
# through that token, so the checkout has to keep it.
rules:
  excessive-permissions:
    ignore:
      - release-please.yml
  github-app:
    ignore:
      - release-please.yml
  artipacked:
    ignore:
      - release-please.yml
