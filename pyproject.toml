[project]
name = "otf-api"
version = "0.21.3"
description = "Python OrangeTheory Fitness API Client"
authors = [{ name = "Jessica Smith", email = "j.smith.git1@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
]
dependencies = [
    "attrs>=24.3.0,<25",
    "httpx>=0.27.2",
    "humanize>=4.9.0,<5",
    "inflection==0.5.*",
    "pycognito==2024.5.1",
    "pydantic>=2.7.3",
    "yarl>=1.18.3,<2",
    "tenacity>=9.0.0,<10",
    "cachetools>=5.5.0",
    "pendulum>=3.1.0",
    "diskcache>=5.6.3",
    "platformdirs>=4.3.6",
    "packaging>=24.2",
    "coloredlogs>=15.0.1",
    "faker>=33.0.0",
]

[project.urls]
Documentation = "https://otf-api.readthedocs.io/en/stable/"

[dependency-groups]
dev = [
    "build==1.6.1",
    "house-lint>=0.3.0",
    "mypy-boto3-cognito-identity>=1.38.0",
    "mypy-boto3-cognito-idp>=1.35.93,<2",
    "pyright>=1.1.400",
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "pyyaml>=6.0",
    "respx>=0.21.0",
    "ruff>=0.17.3",
    "tox==4.15.1",
    "twine==5.1.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-autorefs>=0.5.0",
    "mkdocstrings[python]>=0.25.0",
    "griffe-pydantic>=1.0.0",
    "pymdown-extensions>=10.8.1",
]

[tool.uv]
default-groups = ["dev"]


[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools >= 80.0"]
build-backend = "setuptools.build_meta"

# HSL001 section-divider comments and AI-writing filler
# HSL002 imports inside function bodies
# HSL003 a TYPE_CHECKING guard followed by a later top-level import
# HSL004 module constants defined after the first class or function
# HSL101 leaked spec-artifact tokens (AC#/FR#/WP#/T##)
[tool.house-lint]
include = ["src", "tests", "tools", "examples"]
select = ["HSL001", "HSL002", "HSL003", "HSL004", "HSL101"]
